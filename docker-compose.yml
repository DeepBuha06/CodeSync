version: '3.8'

services:
  db:
    image: postgres:15
    container_name: codesync-db
    environment:
      POSTGRES_USER: codesync_user
      POSTGRES_PASSWORD: codesync_password
      POSTGRES_DB: codesync_db
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: codesync-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
