spring.application.name=codesync

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/codesync_db?options=-c%20timezone=UTC
spring.datasource.username=codesync_user
spring.datasource.password=codesync_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.web.socket=DEBUG
